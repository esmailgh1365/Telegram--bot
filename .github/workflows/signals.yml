name: signals

on:
  push:
    paths: ["bundle.zip"]
  schedule:
    - cron: "0 13 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate open signals, then scan
        run: |
          python signals.py evaluate
          python signals.py scan
          python signals.py evaluate

      - name: Notify Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python notify.py

      - name: Commit data
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "update signals"
          git push
